# local 프로필 — docker compose(MySQL·Redis)로 띄운 로컬 인프라에 붙는다. 값은 docker-compose.yml·docker/mysql/init 과 짝이다.
# 실행: docker compose up -d && ./gradlew bootRun   (bootRun 은 SPRING_PROFILES_ACTIVE 가 없으면 local 로 뜬다)

# 논리 키 — 운영에서는 환경변수나 aws·azure·gcp 프로필의 비밀 저장소가 채운다
db-host: ${DB_HOST:localhost}
db-port: ${DB_PORT:3306}
db-reader-username: skeleton_reader
db-reader-password: skeleton_reader
db-writer-username: skeleton_writer
db-writer-password: skeleton_writer
redis-host: ${REDIS_HOST:localhost}
redis-port: ${REDIS_PORT:6379}
core-api-url: ${CORE_API_URL:http://localhost:9999}

spring:
  datasource:
    # 로컬 MySQL 8 은 TLS 없이 caching_sha2_password 를 쓰므로 공개키 조회를 허용한다
    main:
      read:
        url: jdbc:mysql://${db-host}:${db-port}/skeleton_main?allowPublicKeyRetrieval=true&useSSL=false
        hikari:
          maximum-pool-size: 2
      write:
        url: jdbc:mysql://${db-host}:${db-port}/skeleton_main?allowPublicKeyRetrieval=true&useSSL=false
        hikari:
          maximum-pool-size: 2
    sub:
      read:
        url: jdbc:mysql://${db-host}:${db-port}/skeleton_sub?allowPublicKeyRetrieval=true&useSSL=false
        hikari:
          maximum-pool-size: 2
      write:
        url: jdbc:mysql://${db-host}:${db-port}/skeleton_sub?allowPublicKeyRetrieval=true&useSSL=false
        hikari:
          maximum-pool-size: 2

  jpa:
    properties:
      hibernate:
        format_sql: false
        highlight_sql: false
        generate_statistics: false
        session.events.log.LOG_QUERIES_SLOWER_THAN_MS: 1000

  cache:
    redis:
      time-to-live: "1m"

springdoc:
  api-docs:
    enabled: true
